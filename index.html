<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Студия монтажа</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!--
  ═══ СТУДИЯ МОНТАЖА: ПРАВКА ЛИСТА, А НЕ РЕНДЕР ═══
  Монтажный лист - единственный источник правды (ТЗ монтажа 13.11). Страница его ПРАВИТ и
  показывает превью по прокси 480p, а финал собирает песочница: «Сохранить» отдаёт лист
  боту, тот проверяет его ТЕМ ЖЕ валидатором, что и лист режиссёра, пишет поверх версии,
  с которой студия открывалась, и рендерит. Правка, сделанная поверх устаревшей версии,
  отвергается ботом, а не сливается молча - двух версий проекта не бывает.

  ПОЧЕМУ СВОЙ ТАЙМЛАЙН, А НЕ ГОТОВЫЙ РЕДАКТОР. Кандидаты из ТЗ разобраны: OpenCut на
  переписывании и десктопный, OpenReel и FableCut - Chromium-only на WebCodecs/WebGPU,
  Remotion и react-video-editor платные для компаний больше трёх человек, mediabunny не UI.
  Нам нужна одна дорожка клипов уровня Instagram Edits без декодирования в браузере, то
  есть <video>, playbackRate, volume и HTML поверх - это работает в WebView Telegram на
  iOS и Android без COOP/COEP, которых GitHub Pages не даёт.

  ДАННЫЕ: билет - у Worker'а (подпись Telegram проверяет он), проект и превью - с
  песочницы по билету, сохранение - событием на песочницу тем же билетом.
-->
<style>
:root{
  --bg:#0f1115; --card:#171a20; --ink:#e7e9ee; --dim:#9aa2b1; --line:#262b34;
  --accent:#8b5cf6; --accent-ink:#fff; --sel:#2a2140; --bad:#fb7185; --ok:#34d399;
  --clip:#252a34; --photo:#1f3a35; --play:#f59e0b;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f6f7f9; --card:#fff; --ink:#12151a; --dim:#5b6270; --line:#e3e6ea;
         --accent:#7c3aed; --sel:#ede9fe; --clip:#e8ebf1; --photo:#d9efe9; --bad:#9d174d; --ok:#059669 }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:calc(16px + env(safe-area-inset-bottom)); overscroll-behavior:none}
header{display:flex;align-items:center;gap:6px;padding:8px 10px;position:sticky;top:0;z-index:20;
  background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;font-size:13px;padding:8px 11px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;touch-action:manipulation}
button.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.on{border-color:var(--accent);background:var(--sel)}
button[disabled]{opacity:.45}
#say{padding:4px 12px;min-height:20px;font-size:13px}
#say.bad{color:var(--bad)} #say.ok{color:var(--ok)}
#stage{margin:6px auto 0;position:relative;background:#000;border-radius:12px;overflow:hidden;
  max-height:46vh}
#stage video,#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#stage img{transition:transform linear}
.ov{position:absolute;left:6%;right:6%;text-align:center;color:#fff;font-weight:800;
  text-shadow:0 0 4px #000,0 0 4px #000;pointer-events:none;word-break:break-word}
.ov.title{font-family:Impact,"Oswald","Arial Narrow",sans-serif;font-size:7.5cqw;letter-spacing:.5px}
.ov.caption{font-size:4.2cqw;background:rgba(0,0,0,.55);border-radius:6px;padding:2px 6px;
  text-shadow:none;left:10%;right:10%}
.ov.meme{font-family:Impact,"Oswald","Arial Narrow",sans-serif;font-size:8cqw;text-transform:uppercase;
  -webkit-text-stroke:1px #000}
.ov.top{top:10%} .ov.center{top:44%} .ov.bottom{bottom:14%}
#stage{container-type:inline-size}
#ctl{display:flex;align-items:center;gap:8px;padding:8px 12px}
#time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim);flex:1;text-align:center}
#tlwrap{overflow-x:auto;overflow-y:hidden;margin:0 0 4px;padding:6px 0 4px;position:relative;
  -webkit-overflow-scrolling:touch;touch-action:pan-x}
#tl{position:relative;height:74px;margin:0 50vw 0 12px}
.clip{position:absolute;top:8px;height:58px;border-radius:8px;background:var(--clip);
  border:2px solid transparent;overflow:hidden;background-repeat:repeat-x;background-size:auto 100%}
.clip.photo{background-color:var(--photo)}
.clip.sel{border-color:var(--accent)}
.clip .lbl{position:absolute;left:4px;bottom:2px;font-size:11px;color:#fff;text-shadow:0 0 3px #000}
.clip .h{position:absolute;top:0;bottom:0;width:18px;background:var(--accent);opacity:.9;touch-action:none}
.clip .h.l{left:0;border-radius:6px 0 0 6px} .clip .h.r{right:0;border-radius:0 6px 6px 0}
.clip.ghost{opacity:.55;z-index:5}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--play);z-index:6;pointer-events:none}
#ruler{position:absolute;top:0;height:8px;left:0;right:0;font-size:9px;color:var(--dim)}
.tabs{display:flex;gap:6px;padding:4px 12px;overflow-x:auto}
.panel{padding:6px 12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.row label{color:var(--dim);font-size:12px;min-width:76px}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{width:100%;min-height:54px;resize:vertical}
.txt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin:6px 0}
.txt.sel{border-color:var(--accent)}
.hint{color:var(--dim);font-size:12px}
footer{display:flex;gap:8px;padding:10px 12px}
footer button{flex:1}
</style>

<header>
  <button id="bUndo" title="Отменить">↶</button>
  <button id="bRedo" title="Повторить">↷</button>
  <h1 id="ttl">Студия монтажа</h1>
  <button class="p" id="bSave">Сохранить</button>
</header>
<div id="say"></div>
<div id="stage"><video id="v" playsinline webkit-playsinline preload="auto"></video><img id="im" alt="" hidden></div>
<div id="ctl">
  <button id="bPlay">▶︎</button>
  <div id="time">0:00 / 0:00</div>
  <button id="bSplit" title="Разрезать в точке">✂︎</button>
  <button id="bDel" title="Удалить клип">🗑</button>
</div>
<div id="tlwrap"><div id="tl"><div id="ruler"></div><div id="ph"></div></div></div>
<div class="hint" style="padding:0 12px">Тап - выбрать клип. Края - обрезать. Удержи и тяни - переставить.</div>
<div class="tabs" id="tabs"></div>
<div class="panel" id="panel"></div>

<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp;
try { if (tg) { tg.ready(); tg.expand(); } } catch (e) {}
const Q = new URLSearchParams(location.search);
const API = (Q.get('api') || 'https://rtc.harma.cc').replace(/\/+$/, '');
const BASE = (Q.get('pdf') || '').replace(/\/+$/, '');
const NUM = parseInt(Q.get('p') || '0', 10);
const NS = Q.get('ns') || '';
const INIT = (tg && tg.initData) || '';
const VERSION = '8bd5ef693959';
const $ = (id) => document.getElementById(id);
const say = (t, c) => { const e = $('say'); e.textContent = t || ''; e.className = c || ''; };

const XF_DEFAULT = 0.35;
let TICKET = '', SNAP = null, S = null, BASEVER = 0, SRC = {}, LIM = {};
let SEL = -1, SELTXT = -1, T = 0, PLAYING = false, TAB = 'clip', PXS = 40;
const UNDO = [], REDO = [];

/* ── билет и загрузка ─────────────────────────────────────────────────────────── */
async function ticket() {
  if (TICKET) return TICKET;
  const r = await fetch(API + '/pdf/ticket', { method: 'POST', body: '{}', headers: { 'X-Init-Data': INIT } });
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || !j.ticket) throw new Error('пропуск не выдан: ' + ((j && (j.error || j.human)) || ('HTTP ' + r.status)));
  TICKET = j.ticket;
  return TICKET;
}
const media = (name) => BASE + '/pdf/mtg/m/' + encodeURIComponent(name) + '?ticket=' + encodeURIComponent(TICKET);

async function load() {
  if (!INIT) { say('Telegram не передал подпись - открой студию кнопкой из чата.', 'bad'); return; }
  if (!API || !BASE || !NUM || !NS) { say('Ссылка на студию неполная - открой её заново из чата.', 'bad'); return; }
  say('Открываю проект…');
  try {
    await ticket();
    const r = await fetch(BASE + '/pdf/mtg/project?ticket=' + encodeURIComponent(TICKET) + '&ns=' + NS + '&p=' + NUM);
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) { say((j && (j.human || j.error)) || ('HTTP ' + r.status), 'bad'); return; }
    SNAP = j; S = clone(j.sheet || {}); BASEVER = j.version || 0; SRC = j.sources || {}; LIM = j.limits || {};
    S.clips = S.clips || []; S.texts = S.texts || []; S.music = S.music || { on: false };
    S.subtitles = S.subtitles || { on: false }; S.transitions = S.transitions || 'cut';
    $('ttl').textContent = (j.title || 'Монтаж') + ' · №' + NUM;
    say('');
    if (S.clips.length) SEL = 0;
    render(); seek(0);
  } catch (e) { say(String(e && e.message || e), 'bad'); }
}

/* ── лист: та же арифметика, что у рендера (clip_dur, кроссфейд на стыке) ──────── */
const clone = (o) => JSON.parse(JSON.stringify(o));
const r3 = (x) => Math.round(x * 1000) / 1000;
const XF = () => (S.transitions === 'crossfade' ? (LIM.xfade || XF_DEFAULT) : 0);
function dur(c) {
  if (c.kind === 'photo') return +c.dur || 3;
  return Math.max(0.2, ((+c.out || 0) - (+c.in || 0)) / (+c.speed || 1));
}
function timeline() {
  const out = []; let t = 0;
  S.clips.forEach((c, k) => { const d = dur(c); out.push([t, d]); t += d - (k < S.clips.length - 1 ? XF() : 0); });
  return { tl: out, total: Math.max(0, t) };
}
function push() { UNDO.push(JSON.stringify(S)); if (UNDO.length > 60) UNDO.shift(); REDO.length = 0; }
function undo() { if (!UNDO.length) return; REDO.push(JSON.stringify(S)); S = JSON.parse(UNDO.pop()); fixSel(); render(); seek(T); }
function redo() { if (!REDO.length) return; UNDO.push(JSON.stringify(S)); S = JSON.parse(REDO.pop()); fixSel(); render(); seek(T); }
function fixSel() { if (SEL >= S.clips.length) SEL = S.clips.length - 1; if (SELTXT >= S.texts.length) SELTXT = -1; }
const fmt = (t) => { t = Math.max(0, t); const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + (s < 10 ? '0' : '') + s; };

/* ── плеер: глобальное время -> клип -> кадр источника ─────────────────────────── */
const V = $('v'), IM = $('im');
let CUR = -1, RAF = 0, T0 = 0, WALL0 = 0;
function clipAt(t) {
  const { tl } = timeline();
  for (let k = 0; k < tl.length; k++) if (t < tl[k][0] + tl[k][1] - 1e-3) return k;
  return tl.length - 1;
}
function showClip(k, t) {
  const c = S.clips[k]; if (!c) return;
  const s = SRC[c.src] || {};
  const { tl } = timeline();
  const local = Math.max(0, t - tl[k][0]);
  if (c.kind === 'photo') {
    V.pause(); V.hidden = true; IM.hidden = false;
    const want = media(s.proxy || '');
    if (IM.dataset.src !== want) { IM.dataset.src = want; IM.src = want; }
    const z = c.motion === 'zoom_out' ? 1.18 - 0.18 * local / tl[k][1] : c.motion === 'none' ? 1 : 1 + 0.18 * local / tl[k][1];
    IM.style.transition = 'none'; IM.style.transform = 'scale(' + z.toFixed(3) + ')';
  } else {
    IM.hidden = true; V.hidden = false;
    const want = media(s.proxy || '');
    if (V.dataset.src !== want) { V.dataset.src = want; V.src = want; }
    const st = (+c.in || 0) + local * (+c.speed || 1);
    try { if (Math.abs(V.currentTime - st) > 0.25) V.currentTime = st; } catch (e) {}
    V.playbackRate = +c.speed || 1;
    const vol = c.volume == null ? 1 : +c.volume;   // в превью усиление выше 100% не слышно - потолок <video>
    V.volume = Math.max(0, Math.min(1, vol));
    V.muted = (vol === 0);
  }
  CUR = k;
}
function overlays(t) {
  document.querySelectorAll('.ov').forEach((e) => e.remove());
  const st = $('stage');
  for (const x of S.texts) {
    if (t >= +x.start && t <= +x.end && x.text) {
      const e = document.createElement('div');
      e.className = 'ov ' + (x.style || 'title') + ' ' + (x.pos || (x.style === 'caption' ? 'bottom' : 'top'));
      e.textContent = x.text; st.appendChild(e);
    }
  }
  const k = clipAt(t), c = S.clips[k];
  if (c && c.text) { const e = document.createElement('div'); e.className = 'ov caption bottom'; e.textContent = c.text; st.appendChild(e); }
}
function seek(t) {
  const { total } = timeline();
  T = Math.max(0, Math.min(t, total));
  if (!S.clips.length) return;
  showClip(clipAt(T), T); overlays(T); paintHead();
}
function tick() {
  if (!PLAYING) return;
  const { total } = timeline();
  const t = T0 + (performance.now() - WALL0) / 1000;
  if (t >= total) { pause(); seek(0); return; }
  const k = clipAt(t);
  T = t;
  if (k !== CUR) { showClip(k, t); if (S.clips[k].kind !== 'photo') V.play().catch(() => {}); }
  else if (S.clips[k].kind === 'photo') showClip(k, t);
  overlays(t); paintHead();
  RAF = requestAnimationFrame(tick);
}
function play() {
  if (!S.clips.length) return;
  PLAYING = true; $('bPlay').textContent = '❚❚';
  T0 = T; WALL0 = performance.now(); CUR = -1;
  showClip(clipAt(T), T);
  if (S.clips[CUR].kind !== 'photo') V.play().catch(() => {});
  RAF = requestAnimationFrame(tick);
}
function pause() { PLAYING = false; $('bPlay').textContent = '▶︎'; V.pause(); cancelAnimationFrame(RAF); }

/* ── таймлайн ─────────────────────────────────────────────────────────────────── */
function paintHead() {
  $('ph').style.left = (T * PXS) + 'px';
  const { total } = timeline();
  $('time').textContent = fmt(T) + ' / ' + fmt(total);
}
function aspect() {
  const f = S.format || '9:16';
  const [w, h] = f.split(':').map(Number);
  const st = $('stage');
  const maxH = Math.min(window.innerHeight * 0.46, 520);
  let hh = maxH, ww = hh * w / h;
  if (ww > window.innerWidth - 24) { ww = window.innerWidth - 24; hh = ww * h / w; }
  st.style.width = ww + 'px'; st.style.height = hh + 'px';
}
function render() {
  aspect();
  const tlEl = $('tl');
  tlEl.querySelectorAll('.clip').forEach((e) => e.remove());
  const { tl, total } = timeline();
  tlEl.style.width = Math.max(window.innerWidth, total * PXS + 40) + 'px';
  S.clips.forEach((c, k) => {
    const s = SRC[c.src] || {};
    const e = document.createElement('div');
    e.className = 'clip' + (c.kind === 'photo' ? ' photo' : '') + (k === SEL ? ' sel' : '');
    e.style.left = (tl[k][0] * PXS) + 'px';
    e.style.width = Math.max(14, tl[k][1] * PXS - 2) + 'px';
    if (s.thumbs) e.style.backgroundImage = 'url("' + media(s.thumbs) + '")';
    const l = document.createElement('div'); l.className = 'lbl';
    l.textContent = (c.kind === 'photo' ? '📷' : '🎞') + ' ' + tl[k][1].toFixed(1) + 'с' + ((+c.speed || 1) !== 1 ? ' ×' + c.speed : '');
    e.appendChild(l);
    if (k === SEL) {
      const hl = document.createElement('div'); hl.className = 'h l';
      const hr = document.createElement('div'); hr.className = 'h r';
      e.appendChild(hl); e.appendChild(hr);
      trimHandle(hl, k, 'l'); trimHandle(hr, k, 'r');
    }
    clipGestures(e, k);
    tlEl.appendChild(e);
  });
  const ru = $('ruler'); ru.innerHTML = '';
  for (let s = 0; s <= total; s += 5) {
    const m = document.createElement('span'); m.style.position = 'absolute'; m.style.left = (s * PXS) + 'px';
    m.textContent = fmt(s); ru.appendChild(m);
  }
  paintHead(); tabs(); panel();
  $('bUndo').disabled = !UNDO.length; $('bRedo').disabled = !REDO.length;
}

/* перекладка существующих клипов по текущему листу: позиции, ширины, подписи */
function relayout() {
  const { tl, total } = timeline();
  $('tl').style.width = Math.max(window.innerWidth, total * PXS + 40) + 'px';
  document.querySelectorAll('#tl .clip').forEach((e, k) => {
    if (!tl[k]) return;
    const c = S.clips[k];
    e.style.left = (tl[k][0] * PXS) + 'px';
    e.style.width = Math.max(14, tl[k][1] * PXS - 2) + 'px';
    const l = e.querySelector('.lbl');
    if (l) l.textContent = (c.kind === 'photo' ? '📷' : '🎞') + ' ' + tl[k][1].toFixed(1) + 'с' + ((+c.speed || 1) !== 1 ? ' ×' + c.speed : '');
  });
  paintHead();
}

/* обрезка краёв: видео - in/out источника, фото - длительность */
function trimHandle(h, k, side) {
  h.addEventListener('pointerdown', (ev) => {
    ev.stopPropagation(); ev.preventDefault();
    h.setPointerCapture(ev.pointerId); pause(); push();
    const c = S.clips[k], s = SRC[c.src] || {}, x0 = ev.clientX, a0 = clone(c);
    const move = (e2) => {
      const dt = (e2.clientX - x0) / PXS;
      if (c.kind === 'photo') {
        c.dur = r3(Math.max(0.5, Math.min(10, (+a0.dur || 3) + (side === 'r' ? dt : -dt))));
      } else {
        const sp = +c.speed || 1, max = +s.duration || (+a0.out || 1);
        if (side === 'l') c.in = r3(Math.max(0, Math.min((+a0.out) - 0.3 * sp, (+a0.in) + dt * sp)));
        else c.out = r3(Math.max((+a0.in) + 0.3 * sp, Math.min(max, (+a0.out) + dt * sp)));
        c.dur = r3(((+c.out) - (+c.in)) / sp);
      }
      // ВО ВРЕМЯ ЖЕСТА - ТОЛЬКО ПЕРЕКЛАДКА, БЕЗ ПЕРЕСБОРКИ. Полный render() удалял бы ручку
      // из DOM на первом же движении, захват указателя терялся, и обрезка срабатывала
      // на один шаг (поймано прибором check_studio в WebKit).
      relayout(); seek(timeline().tl[k][0] + (side === 'r' ? dur(c) - 0.05 : 0));
    };
    const up = () => { h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); render(); };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  });
}
/* тап - выбрать и встать на клип; удержание 350 мс - перетаскивание */
function clipGestures(e, k) {
  let timer = 0, drag = false, x0 = 0, moved = false;
  e.addEventListener('pointerdown', (ev) => {
    x0 = ev.clientX; moved = false;
    timer = setTimeout(() => {
      drag = true; pause(); e.classList.add('ghost'); e.setPointerCapture(ev.pointerId);
      try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch (x) {}
    }, 350);
  });
  e.addEventListener('pointermove', (ev) => {
    if (Math.abs(ev.clientX - x0) > 8) moved = true;
    if (!drag) { if (moved) clearTimeout(timer); return; }
    ev.preventDefault();
    e.style.transform = 'translateX(' + (ev.clientX - x0) + 'px)';
  });
  const end = (ev) => {
    clearTimeout(timer);
    if (drag) {
      drag = false;
      const { tl } = timeline();
      const rect = $('tl').getBoundingClientRect();
      const tx = (ev.clientX - rect.left) / PXS;
      let to = tl.findIndex(([s, d]) => tx < s + d / 2);
      if (to < 0) to = S.clips.length;
      if (to > k) to -= 1;
      if (to !== k) { push(); const [c] = S.clips.splice(k, 1); S.clips.splice(to, 0, c); SEL = to; }
      render(); seek(timeline().tl[SEL] ? timeline().tl[SEL][0] : 0);
      return;
    }
    if (!moved) { SEL = k; pause(); render(); seek(timeline().tl[k][0] + 0.01); }
  };
  e.addEventListener('pointerup', end); e.addEventListener('pointercancel', () => { clearTimeout(timer); drag = false; render(); });
}

/* разрезать выбранный клип в точке плейхеда */
function split() {
  if (SEL < 0) return;
  const { tl } = timeline(); const c = S.clips[SEL];
  const local = T - tl[SEL][0];
  if (local < 0.3 || local > tl[SEL][1] - 0.3) { say('Встань внутри клипа - не ближе 0.3 с к краю.', 'bad'); return; }
  push();
  const a = clone(c), b = clone(c);
  if (c.kind === 'photo') { a.dur = r3(local); b.dur = r3((+c.dur) - local); }
  else {
    const cut = r3((+c.in) + local * (+c.speed || 1));
    a.out = cut; b.in = cut; a.dur = r3((a.out - a.in) / (+a.speed || 1)); b.dur = r3((b.out - b.in) / (+b.speed || 1));
  }
  b.text = '';
  S.clips.splice(SEL, 1, a, b); SEL += 1; say(''); render(); seek(T);
}
function del() {
  if (SEL < 0 || S.clips.length <= 1) { say('Последний клип не удалить.', 'bad'); return; }
  push(); S.clips.splice(SEL, 1); fixSel(); render(); seek(Math.min(T, timeline().total));
}

/* ── панели: клип, текст, звук, формат ────────────────────────────────────────── */
const TABS = [['clip', 'Клип'], ['text', 'Текст'], ['sound', 'Звук'], ['fmt', 'Формат']];
function tabs() {
  const b = $('tabs'); b.innerHTML = '';
  for (const [k, n] of TABS) { const x = document.createElement('button'); x.textContent = n; if (k === TAB) x.className = 'on'; x.onclick = () => { TAB = k; tabs(); panel(); }; b.appendChild(x); }
}
function btns(row, opts, cur, fn) {
  for (const [v, n] of opts) { const b = document.createElement('button'); b.textContent = n; if (String(v) === String(cur)) b.className = 'on'; b.onclick = () => fn(v); row.appendChild(b); }
}
function line(p, label) { const r = document.createElement('div'); r.className = 'row'; if (label) { const l = document.createElement('label'); l.textContent = label; r.appendChild(l); } p.appendChild(r); return r; }
function panel() {
  const p = $('panel'); p.innerHTML = '';
  if (TAB === 'clip') {
    const c = S.clips[SEL];
    if (!c) { p.textContent = 'Выбери клип на таймлайне.'; return; }
    if (c.kind !== 'photo') {
      btns(line(p, 'Скорость'), [[0.5, '0.5×'], [1, '1×'], [2, '2×']], +c.speed || 1, (v) => {
        push(); c.speed = v; c.dur = r3(((+c.out) - (+c.in)) / v); render(); seek(T); });
      const r = line(p, 'Громкость');
      const sl = document.createElement('input'); sl.type = 'range'; sl.min = 0; sl.max = 200; sl.step = 5;
      sl.value = Math.round((c.volume == null ? 1 : +c.volume) * 100);
      const out = document.createElement('span'); out.textContent = sl.value + '%';
      sl.onpointerdown = () => push();
      sl.oninput = () => { c.volume = +sl.value / 100; out.textContent = sl.value + '%'; };
      r.appendChild(sl); r.appendChild(out);
    } else {
      btns(line(p, 'Движение'), [['zoom_in', 'Наезд'], ['zoom_out', 'Отъезд'], ['pan_left', '←'], ['pan_right', '→'], ['none', 'Стоп']],
        c.motion || 'zoom_in', (v) => { push(); c.motion = v; render(); seek(T); });
    }
    const r2 = line(p, 'Подпись');
    const it = document.createElement('input'); it.type = 'text'; it.maxLength = LIM.max_text || 140; it.value = c.text || '';
    it.placeholder = 'текст на время клипа'; it.style.flex = '1';
    it.onfocus = () => push(); it.oninput = () => { c.text = it.value; overlays(T); };
    r2.appendChild(it);
    return;
  }
  if (TAB === 'text') {
    const add = document.createElement('button'); add.textContent = '+ Текст здесь'; add.className = 'p';
    add.onclick = () => { push(); const { total } = timeline(); S.texts.push({ text: 'Текст', start: r3(T), end: r3(Math.min(total, T + 2.5)), style: 'title', pos: 'top' }); SELTXT = S.texts.length - 1; panel(); overlays(T); };
    line(p).appendChild(add);
    S.texts.forEach((x, k) => {
      const box = document.createElement('div'); box.className = 'txt' + (k === SELTXT ? ' sel' : '');
      const ta = document.createElement('textarea'); ta.maxLength = LIM.max_text || 140; ta.value = x.text;
      ta.onfocus = () => { if (SELTXT !== k) { SELTXT = k; } push(); };
      ta.oninput = () => { x.text = ta.value; overlays(T); };
      box.appendChild(ta);
      const rr = document.createElement('div'); rr.className = 'row';
      const tm = document.createElement('span'); tm.className = 'hint'; tm.textContent = x.start.toFixed(1) + '–' + x.end.toFixed(1) + ' с';
      rr.appendChild(tm);
      const mk = (n, fn) => { const b = document.createElement('button'); b.textContent = n; b.onclick = () => { push(); fn(); const { total } = timeline(); x.start = r3(Math.max(0, Math.min(x.start, total - 0.3))); x.end = r3(Math.max(x.start + 0.3, Math.min(x.end, total))); panel(); overlays(T); }; rr.appendChild(b); };
      mk('Начало ▸ сюда', () => { const d = x.end - x.start; x.start = T; x.end = T + d; });
      mk('−0.5с', () => { x.end -= 0.5; }); mk('+0.5с', () => { x.end += 0.5; });
      mk('🗑', () => { S.texts.splice(k, 1); SELTXT = -1; });
      box.appendChild(rr);
      const r3w = document.createElement('div'); r3w.className = 'row';
      btns(r3w, [['title', 'Заголовок'], ['caption', 'Плашка'], ['meme', 'Мем']], x.style || 'title', (v) => { push(); x.style = v; panel(); overlays(T); });
      btns(r3w, [['top', '⬆'], ['center', '⏺'], ['bottom', '⬇']], x.pos || 'top', (v) => { push(); x.pos = v; panel(); overlays(T); });
      box.appendChild(r3w);
      p.appendChild(box);
    });
    return;
  }
  if (TAB === 'sound') {
    const m = S.music;
    btns(line(p, 'Музыка'), [[true, 'Вкл'], [false, 'Выкл']], !!m.on, (v) => { push(); m.on = v; if (v && !m.prompt) m.prompt = 'uplifting background music'; panel(); });
    if (m.on) {
      const r = line(p, 'Громкость');
      const sl = document.createElement('input'); sl.type = 'range'; sl.min = 0; sl.max = 100; sl.step = 5;
      sl.value = Math.round((m.volume == null ? 0.35 : +m.volume) * 100);
      const o = document.createElement('span'); o.textContent = sl.value + '%';
      sl.onpointerdown = () => push(); sl.oninput = () => { m.volume = +sl.value / 100; o.textContent = sl.value + '%'; };
      r.appendChild(sl); r.appendChild(o);
      const r2 = line(p, 'Какая');
      const it = document.createElement('input'); it.type = 'text'; it.value = m.prompt || ''; it.style.flex = '1'; it.maxLength = 300;
      it.onfocus = () => push(); it.oninput = () => { m.prompt = it.value; };
      r2.appendChild(it);
      const b = document.createElement('button'); b.textContent = '🎲 Другой трек';
      b.onclick = () => event({ kind: 'music', num: NUM, prompt: m.prompt || '' }, 'Заказал новый трек - он войдёт в следующее сохранение.');
      line(p).appendChild(b);
    }
    if (SNAP && SNAP.has_speech) {
      const s = S.subtitles;
      btns(line(p, 'Субтитры'), [[true, 'Вкл'], [false, 'Выкл']], !!s.on, (v) => { push(); s.on = v; if (v && !s.style) s.style = 'karaoke'; panel(); });
      if (s.on) btns(line(p, 'Стиль'), [['karaoke', 'Караоке'], ['clean', 'Чистые'], ['bold', 'Крупные']], s.style || 'karaoke', (v) => { push(); s.style = v; panel(); });
    } else line(p).appendChild(Object.assign(document.createElement('span'), { className: 'hint', textContent: 'Речи в материалах нет - субтитров не будет.' }));
    return;
  }
  if (TAB === 'fmt') {
    btns(line(p, 'Формат'), [['9:16', '9:16'], ['1:1', '1:1'], ['16:9', '16:9']], S.format || '9:16', (v) => { push(); S.format = v; render(); seek(T); });
    btns(line(p, 'Стыки'), [['cut', 'Склейка'], ['crossfade', 'Наплыв']], S.transitions || 'cut', (v) => { push(); S.transitions = v; render(); seek(T); });
  }
}

/* ── сохранение: лист уходит боту, финал собирает песочница ────────────────────── */
function prepare() {
  const out = clone(S);
  for (const c of out.clips) { if (c.kind !== 'photo') { c.speed = +c.speed || 1; c.dur = r3(((+c.out) - (+c.in)) / c.speed); } }
  const t = (function () { const o = S; S = out; const r = timeline().total; S = o; return r; })();
  out.target_sec = r3(t);
  const max = LIM.max_sec || 90;
  if (t > max) return [null, 'Ролик длиннее ' + max + ' с - укороти.'];
  for (const x of out.texts) { x.start = r3(Math.max(0, +x.start)); x.end = r3(Math.min(t, +x.end)); }
  out.texts = out.texts.filter((x) => x.text && x.text.trim() && x.end > x.start + 0.2);
  return [out, ''];
}
async function event(body, ok) {
  try {
    await ticket();
    const r = await fetch(BASE + '/pdf/mtg/event?ticket=' + encodeURIComponent(TICKET), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ ns: NS }, body)) });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) { say((j && (j.human || j.error)) || ('HTTP ' + r.status), 'bad'); return false; }
    say(ok, 'ok'); return true;
  } catch (e) { say(String(e && e.message || e), 'bad'); return false; }
}
async function save() {
  pause();
  const [sh, why] = prepare();
  if (!sh) { say(why, 'bad'); return; }
  $('bSave').disabled = true;
  const ok = await event({ kind: 'save', num: NUM, base_version: BASEVER, sheet: sh },
    'Сохранено. Соберу финал и пришлю в чат.');
  if (ok) setTimeout(() => { try { tg && tg.close(); } catch (e) {} }, 1200);
  else $('bSave').disabled = false;
}

$('bPlay').onclick = () => (PLAYING ? pause() : play());
$('bSplit').onclick = split; $('bDel').onclick = del;
$('bUndo').onclick = undo; $('bRedo').onclick = redo; $('bSave').onclick = save;
$('tlwrap').addEventListener('click', (ev) => {
  if (ev.target.closest('.clip')) return;
  const rect = $('tl').getBoundingClientRect(); pause(); seek((ev.clientX - rect.left) / PXS);
});
window.addEventListener('resize', () => { if (S) render(); });
V.addEventListener('error', () => { if (V.src) say('Превью не грузится - возможно, убрано по сроку. Открой студию из чата заново.', 'bad'); });
load();
</script>
